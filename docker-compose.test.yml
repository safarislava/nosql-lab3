name: nosql_lab3_test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: nosql_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nosql_store_test
    ports:
      - "5433:5432"
    volumes:
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d nosql_store_test" ]
      interval: 2s
      timeout: 3s
      retries: 20

  riak-test:
    image: basho/riak-kv:ubuntu-2.2.3
    container_name: nosql_riak_test
    platform: linux/amd64
    hostname: riak
    environment:
      CLUSTER_NAME: riakkv
    labels:
      com.basho.riak.cluster.name: riakkv
    ports:
      - "8088:8087"
      - "8099:8098"
    volumes:
      - ./backend/scripts/riak-prestart.sh:/etc/riak/prestart.d/00-prestart.sh:ro
      - ./backend/scripts/riak-poststart.sh:/etc/riak/poststart.d/00-poststart.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -f http://127.0.0.1:8098/ping >/dev/null && [ -f /tmp/.riak_initialized ] || exit 1" ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 40s

  couchdb1-test:
    image: couchdb:3.4
    container_name: nosql_couchdb1_test
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:5984/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  couchdb2-test:
    image: couchdb:3.4
    container_name: nosql_couchdb2_test
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    ports:
      - "5985:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:5984/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  cassandra1-test:
    image: cassandra:5.0
    container_name: cassandra1_test
    hostname: cassandra1-test
    environment:
      CASSANDRA_CLUSTER_NAME: cluster_test
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1-test
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra1-test-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  cassandra2-test:
    image: cassandra:5.0
    container_name: cassandra2_test
    hostname: cassandra2-test
    environment:
      CASSANDRA_CLUSTER_NAME: cluster_test
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1-test
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9043:9042"
    volumes:
      - cassandra2-test-data:/var/lib/cassandra
    depends_on:
      cassandra1-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  cassandra3-test:
    image: cassandra:5.0
    container_name: cassandra3_test
    hostname: cassandra3-test
    environment:
      CASSANDRA_CLUSTER_NAME: cluster_test
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1-test
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9044:9042"
    volumes:
      - cassandra3-test-data:/var/lib/cassandra
    depends_on:
      cassandra2-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  cassandra-init-test:
    image: cassandra:5.0
    container_name: cassandra_init_test
    depends_on:
      cassandra1-test:
        condition: service_healthy
      cassandra2-test:
        condition: service_healthy
      cassandra3-test:
        condition: service_healthy
    volumes:
      - ./backend/scripts/init_cassandra.cql:/init_cassandra.cql:ro
    entrypoint: ["cqlsh", "cassandra1-test", "-f", "/init_cassandra.cql"]
    restart: "no"

volumes:
  cassandra1-test-data:
  cassandra2-test-data:
  cassandra3-test-data:
